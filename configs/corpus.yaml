corpus:
  target_papers: 10000

  language: en

  publication_year:
    min: 2017
    max: 2026

  work_types:
    - article
    - preprint

  require_open_access: true
  require_full_text: true

discovery:
  candidate_target: 30000
  per_page: 100
  max_results_per_query: 1500
  request_delay_seconds: 0.1
  raw_output:
    data/raw/metadata/discovery_raw.jsonl

  unique_output:
    data/interim/candidates_unique.jsonl

  report_output:
    data/interim/discovery_report.json

