corpus:
  target_papers: 10000

  language: en

  publication_year:
    min: 2017
    max: 2026

  work_types:
    - article
    - preprint

  require_open_access: true
  require_full_text: true

discovery:
  candidate_target: 30000
  per_page: 100
  max_results_per_query: 1500
  request_delay_seconds: 0.1
  raw_output:
    data/raw/metadata/discovery_raw.jsonl

  unique_output:
    data/interim/candidates_unique.jsonl

  report_output:
    data/interim/discovery_report.json


selection:
  retain_score: 8
  ambiguous_score: 4

  require_abstract: false
  require_downloadable_content: false

  retained_output:
    data/processed/corpus_selected.jsonl

  ambiguous_output:
    data/interim/corpus_ambiguous.jsonl

  rejected_output:
    data/interim/corpus_rejected.jsonl

  report_output:
    data/interim/selection_report.json

ollama_screening:
  model: "qwen3:14b"
  host: "http://localhost:11434"

  # Twenty papers are sent in one request. Only title and the first
  # 400 abstract characters are included.
  batch_size: 20
  preview_characters: 400
  context_window: 8192
  num_predict: 120
  timeout_seconds: 300
  max_retries: 3
  retry_delay_seconds: 3
  keep_alive: "30m"

  input_path: "data/interim/corpus_ambiguous.jsonl"

  # Papers already present here bypass screening.
  existing_graded_path: "data/interim/ambiguous_graded.jsonl"

  decisions_output_path: "data/interim/ambiguous_screening_decisions.jsonl"
  shortlist_output_path: "data/interim/ambiguous_screened_shortlist.jsonl"
  rejected_output_path: "data/interim/ambiguous_screened_rejected.jsonl"
  report_path: "data/interim/ambiguous_screening_report.json"

ollama_grading:
  model: "qwen3:14b"
  host: "http://localhost:11434"

  # One shortlisted paper is sent in each request.
  batch_size: 10
  context_window: 8192
  max_abstract_characters: 2500
  num_predict: 120
  timeout_seconds: 300
  max_retries: 3
  retry_delay_seconds: 3
  keep_alive: "30m"

  accepted_min_score: 0.80
  rejected_max_score: 0.39

  input_path: "data/interim/ambiguous_screened_shortlist.jsonl"
  graded_output_path: "data/interim/ambiguous_graded.jsonl"
  accepted_output_path: "data/interim/ambiguous_accepted.jsonl"
  review_output_path: "data/interim/ambiguous_review.jsonl"
  rejected_output_path: "data/interim/ambiguous_rejected.jsonl"
  checkpoint_path: "data/interim/ambiguous_grading_checkpoint.json"
  report_path: "data/interim/llm_grading_report.json"
  selection_report_path: "data/interim/selection_report.json"

final_corpus:
  # Permit a high-precision release while preserving ungraded
  # shortlisted papers for future review.
  allow_deferred_review: true

  manual_approved_input: "data/interim/ambiguous_manual_approved.jsonl"
  output: "data/processed/final_corpus.jsonl"
  report_output: "data/interim/final_corpus_report.json"

oa_location_enrichment:
  input_path: "data/processed/final_corpus.jsonl"
  output_path: "data/interim/final_corpus_oa_enriched.jsonl"
  report_path: "data/interim/oa_location_enrichment_report.json"
  failures_path: "data/interim/oa_location_enrichment_failures.jsonl"

  # A small validation run before processing the complete corpus.
  default_limit: 25

  max_retries: 5
  request_delay_seconds: 0.2

direct_pdf_download:
  input_path: "data/interim/final_corpus_oa_enriched.jsonl"
  output_directory: "data/raw/content/pdf"

  manifest_path: "data/interim/direct_pdf_manifest.jsonl"
  report_path: "data/interim/direct_pdf_download_report.json"
  failures_path: "data/interim/direct_pdf_download_failures.jsonl"

  # Validate ten papers before running the full corpus.
  default_limit: 10

  connect_timeout_seconds: 20
  read_timeout_seconds: 180
  max_retries_per_url: 2
  retry_delay_seconds: 3

  # Delay between papers and between fallback URLs.
  request_delay_seconds: 1.0
  fallback_delay_seconds: 1.0

  chunk_size_bytes: 65536
  minimum_pdf_bytes: 10000
  maximum_pdf_bytes: 104857600

  # If every PDF URL fails, look for structured open-access full text
  # in Europe PMC. JATS XML is stored separately and is never renamed
  # to PDF.
  europe_pmc_fallback:
    enabled: true
    output_directory: "data/raw/content/xml"
    search_url: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
    full_text_base_url: "https://www.ebi.ac.uk/europepmc/webservices/rest"

    connect_timeout_seconds: 20
    read_timeout_seconds: 180
    max_retries: 2
    retry_delay_seconds: 3

    chunk_size_bytes: 65536
    minimum_xml_bytes: 1000
    maximum_xml_bytes: 52428800

  # www.mdpi.com returns HTTP 403 to automated clients, but the same
  # PDFs are served from MDPI's static CDN. The journal slug is
  # verified once per ISSN before any download is attempted.
  mdpi_cdn_fallback:
    enabled: true
    base_url: "https://mdpi-res.com/d_attachment"

  # Last resort: full text hosted by OpenAlex. Requires
  # OPENALEX_API_KEY. Each file costs $0.01 against a $1 free-tier
  # window (~93 minutes); the downloader reads the x-ratelimit
  # headers and waits for the window to reset instead of failing.
  openalex_content_fallback:
    enabled: true
    xml_output_directory: "data/raw/content/xml"
    max_wait_seconds: 7200
    request_delay_seconds: 0.5

corpus_audit:
  corpus_path: "data/processed/final_corpus.jsonl"
  manifest_path: "data/interim/direct_pdf_manifest.jsonl"

  pdf_directory: "data/raw/content/pdf"
  xml_directory: "data/raw/content/xml"

  inventory_output: "data/interim/local_content_inventory.jsonl"
  report_output: "data/interim/local_content_audit_report.json"

  minimum_pdf_bytes: 10000
  minimum_xml_bytes: 1000

text_extraction:
  minimum_text_characters: 500

  jats:
    corpus_path: "data/processed/final_corpus.jsonl"
    inventory_path: "data/interim/local_content_inventory.jsonl"

    parsed_output: "data/processed/parsed_jats_papers.jsonl"
    failures_output: "data/interim/jats_extraction_failures.jsonl"
    report_output: "data/interim/jats_extraction_report.json"

  grobid:
    base_url: "http://localhost:8070"

    inventory_path: "data/interim/local_content_inventory.jsonl"
    corpus_path: "data/processed/final_corpus.jsonl"

    output_directory: "data/raw/content/tei"
    manifest_path: "data/interim/grobid_manifest.jsonl"
    failures_path: "data/interim/grobid_failures.jsonl"
    report_path: "data/interim/grobid_report.json"

    timeout_seconds: 180
    max_retries: 3
    retry_delay_seconds: 5
    request_delay_seconds: 0.25

    minimum_tei_bytes: 1000
    consolidate_header: false
    consolidate_citations: false

  # For backwards compatibility, TEI extraction is still supported
  # as a fallback.
  tei:
    corpus_path: "data/processed/final_corpus.jsonl"
    inventory_path: "data/interim/local_content_inventory.jsonl"
    tei_directory: "data/raw/content/tei"

    parsed_output: "data/processed/parsed_tei_papers.jsonl"
    failures_output: "data/interim/tei_extraction_failures.jsonl"
    report_output: "data/interim/tei_extraction_report.json"

  unified:
    corpus_path: "data/processed/final_corpus.jsonl"
    parsed_jats_path: "data/processed/parsed_jats_papers.jsonl"
    parsed_tei_path: "data/processed/parsed_tei_papers.jsonl"

    output_path: "data/processed/parsed_corpus.jsonl"
    report_path: "data/interim/parsed_corpus_report.json"

chunking:
  input_path: "data/processed/parsed_corpus.jsonl"
  output_path: "data/processed/document_chunks.jsonl"
  report_path: "data/interim/chunking_report.json"

  max_tokens: 300
  overlap_tokens: 50
  include_abstract: true
  small_chunk_threshold: 40
  progress_interval: 100

retrieval:
  chunks_path: "data/processed/document_chunks.jsonl"

  faiss_index_path: "data/processed/indexes/dense.faiss"
  sqlite_index_path: "data/processed/indexes/retrieval.sqlite3"
  build_report_path: "data/interim/retrieval_index_report.json"

  minimum_index_tokens: 5

  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_batch_size: 64

  query_prefix: "Represent this sentence for searching relevant passages: "

  dense_top_k: 50
  sparse_top_k: 50

  rrf_k: 60
  fusion_top_k: 30

  reranker_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  reranker_batch_size: 16

  final_top_k: 10
  max_chunks_per_paper: 3

agentic_rag:
  # Initially, qwen3:14b performs routing, grading, generation,
  # and self-checking. Separate models can be configured later.
  model: "qwen3:14b"
  host: "http://localhost:11434"

  context_window: 8192
  num_predict: 500
  temperature: 0.0
  seed: 42
  think: false

  keep_alive: "30m"
  max_retries: 3
  retry_delay_seconds: 2

  # Each retrieved chunk is shortened only when building an LLM prompt.
  # The original indexed chunk is not modified.
  maximum_context_characters_per_document: 2400
  maximum_grader_characters_per_document: 1600
  maximum_rewrite_characters_per_document: 1200
    # Maximum evidence characters used by hallucination and answer critics.
  maximum_verifier_characters_per_document: 1800

  # Protect the cyclic graph from accidental infinite loops.
  graph_recursion_limit: 40
  maximum_accumulated_documents: 12

  retrieval_top_k: 10
  maximum_rewrite_attempts: 2
  maximum_generation_attempts: 2

web_search:
  enabled: true
  provider: "tavily"

  max_results: 5
  search_depth: "advanced"
  topic: "general"

  maximum_content_characters: 4000
  maximum_combined_documents: 12

domain:
  name: "Agentic Retrieval-Augmented Generation"

  search_queries:
    - "retrieval augmented generation"
    - "corrective retrieval augmented generation"
    - "self reflective retrieval augmented generation"
    - "adaptive retrieval augmented generation"
    - "agentic retrieval"
    - "retrieval grounding"
    - "hallucination detection large language models"
    - "citation verification large language models"
    - "large language model agents"
    - "query rewriting retrieval"
    - "multi hop question answering"
    - "open domain question answering"
    - "dense retrieval"
    - "sparse retrieval"
    - "hybrid retrieval"
    - "neural information retrieval"
    - "retrieval reranking"
    - "cross encoder reranking"
