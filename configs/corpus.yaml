corpus:
  target_papers: 10000

  language: en

  publication_year:
    min: 2017
    max: 2026

  work_types:
    - article
    - preprint

  require_open_access: true
  require_full_text: true

discovery:
  candidate_target: 15000
  per_page: 100
  max_results_per_query: 2000
  request_delay_seconds: 0.1
  raw_output:
    data/raw/metadata/discovery_raw.jsonl

  unique_output:
    data/interim/candidates_unique.jsonl

  report_output:
    data/interim/discovery_report.json



domain:
  name: "Agentic Retrieval-Augmented Generation"

  search_queries:
    - "retrieval augmented generation"
    - "dense retrieval"
    - "sparse retrieval"
    - "hybrid retrieval"
    - "neural information retrieval"
    - "retrieval reranking"
    - "cross encoder reranking"
    - "multi hop question answering"
    - "open domain question answering"
    - "query rewriting retrieval"
    - "large language model agents"
    - "agentic retrieval"
    - "retrieval grounding"
    - "hallucination detection"
    - "citation verification"
    - "self correcting retrieval"