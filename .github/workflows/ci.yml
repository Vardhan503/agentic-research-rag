name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-evaluation.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements-evaluation.txt

      - name: Ruff
        run: ruff check src tests scripts

      # Tests use fakes for the LLM, retriever and web search, so no API keys
      # or index files are needed here.
      - name: Pytest
        run: pytest -q
