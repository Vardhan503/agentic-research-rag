[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "agentic-research-rag"
version = "0.1.0"
description = "Production-grade Agentic RAG system over scientific research papers"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "ollama>=0.6.2",
    "pydantic>=2.12",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.4",
    "tavily-python>=0.7",
    "langgraph>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.4.4,<1.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned so CI results do not change when ruff's default rule set changes.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DTZ", "RUF", "PLC", "PLE", "PLW", "PERF"]
ignore = [
    # Nested ifs / manual list copies in the ingestion code read fine as written.
    "SIM102",
    "SIM113",
    "PERF401",
    "PERF402",
    # Heavy optional dependencies (faiss, sentence-transformers, openai) are
    # imported lazily inside the functions that need them.
    "PLC0415",
    # Long lines in prompts and test fixtures are wrapped by the formatter where it matters.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Fakes in tests are allowed mutable class attributes and unused fixtures.
"tests/*" = ["RUF012", "B011"]